name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: city_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d city_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix project_backend
      - run: npm test --prefix project_backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci_only_password@127.0.0.1:5432/city_test
      - run: npm ci --prefix project_frontend
      - run: npm run lint --prefix project_frontend
      - run: npm run build --prefix project_frontend
