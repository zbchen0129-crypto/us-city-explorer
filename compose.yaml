services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: city_explorer
      POSTGRES_USER: city_explorer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - city-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city_explorer -d city_explorer"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  city-data:
